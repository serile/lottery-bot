name: Check Winning
on:
  schedule:
    - cron: 7 13 * * 6 # every Saturday on 10:07 PM (KST)
    - cron: 37 13 * * 6 # backup confirmation at 10:37 PM (KST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-bot-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Check Winning
    timeout-minutes: 10
    steps:  

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Checkout bot state
        uses: actions/checkout@v5
        with:
          ref: bot-state
          path: .bot-state
          fetch-depth: 0

      - name: Run Scripts
        run: make check # or use 'make check_lotto' / 'make check_win720' for granular check
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECK_LOTTO645: ${{ vars.CHECK_LOTTO645 || 'true' }}
          CHECK_WIN720: ${{ vars.CHECK_WIN720 || 'true' }}
          LOTTERY_STATE_DIR: .bot-state/.lottery-bot

      - name: Commit bot state
        if: always()
        working-directory: .bot-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lottery-bot
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record lottery bot state"
          git pull --rebase origin bot-state
          git push origin HEAD:bot-state
