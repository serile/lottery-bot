name: Check Winning
on:
  schedule:
    - cron: 0 13 * * 6 # every Saturday on 10:00 PM (KST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lottery-bot-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Check Winning
    timeout-minutes: 10
    steps:  

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Scripts
        run: make check # or use 'make check_lotto' / 'make check_win720' for granular check
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECK_LOTTO645: ${{ vars.CHECK_LOTTO645 || 'true' }}
          CHECK_WIN720: ${{ vars.CHECK_WIN720 || 'true' }}
