name: Buy lotto
on:
  schedule:
    # Primary window: Thursday 18:45~19:57 KST, avoiding the top of the UTC hour.
    - cron: '45,50,55 9 * * 4'
    - cron: '2-57/5 10 * * 4'
    # Backup checks before the Saturday sales deadline, in case every Thursday run was missed.
    - cron: '17 0 * * 5'
    - cron: '47 9 * * 5'
    - cron: '17 0 * * 6'
    - cron: '47 9 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-bot-purchase
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Buy lotto
    timeout-minutes: 10
    steps:  

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Checkout bot state
        uses: actions/checkout@v5
        with:
          ref: bot-state
          path: .bot-state
          fetch-depth: 0
      
      - name: Run Scripts
        run: make buy # or use 'make buy_lotto' / 'make buy_win720' for granular purchase
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOTTO645_COUNT: ${{ vars.LOTTO645_COUNT || '1' }}
          BUY_LOTTO645: ${{ vars.BUY_LOTTO645 || 'true' }}
          BUY_WIN720: ${{ vars.BUY_WIN720 || 'false' }}
          MAX_WEEKLY_SPEND: ${{ vars.MAX_WEEKLY_SPEND || '1000' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOTTERY_STATE_DIR: .bot-state/.lottery-bot

      - name: Commit bot state
        if: always()
        working-directory: .bot-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lottery-bot
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record lottery bot state"
          git pull --rebase origin bot-state
          git push origin HEAD:bot-state

      - name: Notify purchase confirmation failure
        if: failure()
        run: >-
          python -c "import os; from notification import Notification;
          Notification()._send_discord_webhook(os.environ.get('DISCORD_WEBHOOK_URL', ''),
          '⚠️ 로또 자동 구매 확인에 실패했습니다. 구매 여부를 동행복권에서 확인하고 GitHub Actions 로그를 확인하세요.')"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
